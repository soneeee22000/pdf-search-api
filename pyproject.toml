[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-search-api"
version = "1.0.0"
description = "Similarity search over chunks extracted from a local PDF corpus."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pypdfium2==5.13.0",
    "faiss-cpu==1.15.0",
    "numpy==2.2.6",
    "sentence-transformers==5.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.13.3", "mypy==1.18.2"]

[project.scripts]
pdf-search-ingest = "pdf_search.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI's dependency injection is expressed as a call in an argument
# default; that is the framework's documented idiom, not the mutable-default
# bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "eval"]
mypy_path = "src"

# faiss, pypdfium2, sentence-transformers and psutil ship no type information.
# Their call sites are typed here; the libraries themselves cannot be.
[[tool.mypy.overrides]]
module = ["faiss.*", "pypdfium2.*", "sentence_transformers.*", "psutil.*"]
ignore_missing_imports = true
